<!DOCTYPE html>
<html lang="es">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>🎉 ¡Cumpleaños de Axel Itzae! 🍄</title>

<!-- Fuentes: Google Fonts para Fredoka y Press Start 2P -->
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;700;900&family=Press+Start+2P&display=swap" rel="stylesheet">

<!-- 1. CAMBIO AQUÍ: Se agrega Font Awesome para poder usar el icono del calendario -->
<link rel="stylesheet" href="https://cloudflare.com">

<!-- Librería de Confeti para la lluvia de estrellas/confeti -->
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>

<style>
/* =========================
   CONFIGURACIÓN GENERAL
========================= */
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  overflow-x: hidden;
  font-family: 'Fredoka', sans-serif;
  color: #333;
  
  /* FONDO FIJO ESTABLECIDO */
  background-image: url('fondo.jpg');
  background-size: cover;
  background-position: center;
  background-repeat: no-repeat;
  background-attachment: fixed;
  
  display: flex;
  justify-content: center;
  align-items: center;
  padding: 15px 12px;
}

.container {
  width: 100%;
  max-width: 430px;
  text-align: center;
  position: relative;
  z-index: 10;
}

/* =========================
   ENCABEZADO CON LOGO ESTILO CLÁSICO Y REBOTE
========================= */
.playful-header {
  margin-bottom: 15px;
  display: flex;
  flex-direction: column;
  align-items: center;
}

.playful-invitacion {
  font-size: 1.3rem;
  color: #fff;
  text-shadow: 3px 3px 0px #000;
  letter-spacing: 1px;
  font-weight: 900;
  margin-bottom: 8px;
  display: block;
}

.playful-logo-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin: 10px 0;
  gap: 0px;
  animation: reboteLogoBloque 1.2s infinite ease-in-out alternate;
}

.playful-name-line {
  display: flex;
  justify-content: center;
  gap: 1px;
  flex-wrap: nowrap;
}

.letter {
  font-family: 'Fredoka', sans-serif;
  font-size: 4rem;
  font-weight: 900;
  text-shadow: 
    5px 5px 0px #000, 
    -5px -5px 0px #000, 
    5px -5px 0px #000, 
    -5px 5px 0px #000,
    0px 6px 0px #000,
    3px 9px 0px #000,
    0px 14px 18px rgba(0,0,0,0.85);
  display: inline-block;
  padding: 0 1px;
  line-height: 0.85;
}

.l1 { color: #00e5ff; transform: rotate(-10deg) translateY(6px); }
.l2 { color: #ffeb3b; transform: rotate(5deg) translateY(-4px); }
.l3 { color: #e52521; transform: rotate(-8deg) translateY(4px); }
.l4 { color: #76ff03; transform: rotate(8deg) translateY(-6px); }

.l5 { color: #e52521; transform: rotate(-6deg) translateY(-4px); }
.l6 { color: #76ff03; transform: rotate(9deg) translateY(6px); }
.l7 { color: #ffeb3b; transform: rotate(-9deg) translateY(-5px); }
.l8 { color: #00e5ff; transform: rotate(6deg) translateY(3px); }
.l9 { color: #ff9100; transform: rotate(-5deg) translateY(-2px); }

@keyframes reboteLogoBloque {
  0% { transform: translateY(0px); }
  100% { transform: translateY(-10px); }
}

.playful-nivel {
  font-size: 1.25rem;
  color: #fcd85c;
  text-shadow: 2px 2px 0px #000, -1px -1px 0px #000, 1px -1px 0px #000;
  font-weight: 900;
  letter-spacing: 0.5px;
  margin-top: 14px;
  display: block;
}

/* =========================
   DECORACIONES SUPERIORES
========================= */
.decorations-container {
  display: flex;
  justify-content: center;
  gap: 20px;
  margin-bottom: 20px;
}

.mario-icon-decor {
  width: 52px;
  height: 52px;
  object-fit: contain;
  filter: drop-shadow(0 4px 3px rgba(0,0,0,0.5));
  animation: brincoBloque 1.4s infinite ease-in-out alternate;
  background: transparent;
  cursor: pointer;
  transition: transform 0.1s ease;
}

.mario-icon-decor:active {
  transform: scale(0.85) translateY(4px);
}

.decorations-container .mario-icon-decor:nth-child(2) { animation-delay: 0.3s; }
.decorations-container .mario-icon-decor:nth-child(3) { animation-delay: 0.6s; }

@keyframes brincoBloque {
  0% { transform: translateY(0); }
  50% { transform: translateY(-8px); }
  100% { transform: translateY(0); }
}

/* =========================
   TARJETAS DE INFORMACIÓN
========================= */
.slots-wrapper {
  display: flex;
  flex-direction: column;
  gap: 14px;
  margin-bottom: 14px;
}

.file-slot {
  background: #ffffff;
  border: 4px solid #7f7f7f;
  border-radius: 14px;
  padding: 16px 18px;
  display: flex;
  align-items: center;
  justify-content: space-between;
  box-shadow: inset 0 -5px 0 #d9d9d9, 0 6px 12px rgba(0, 0, 0, 0.4);
  position: relative;
  cursor: pointer;
  animation: movimientoSecuencial 3s infinite ease-in-out alternate;
  transition: filter 0.1s ease, border 0.2s ease, opacity 0.3s ease;
  opacity: 0.65;
}

.file-slot:hover {
  filter: brightness(0.95);
}

.file-slot.active {
  border: 4px solid #f29f05;
  opacity: 1; 
}
.file-slot.active::before {
  content: '';
  position: absolute;
  top: -2px; left: -2px; right: -2px; bottom: -2px;
  border: 3px solid #f2cb05;
  border-radius: 12px;
  pointer-events: none;
}

.file-slot:nth-of-type(1) { animation-delay: 0s; }
.file-slot:nth-of-type(2) { animation-delay: 0.5s; }
.file-slot:nth-of-type(3) { animation-delay: 1s; }

@keyframes movimientoSecuencial {
  0% { transform: translateX(-10px); }
  100% { transform: translateX(10px); }
}

.slot-left {
  display: flex;
  align-items: center;
  gap: 15px;
}

.file-number {
  font-size: 2.4rem;
  color: #f29f05;
  text-shadow: 2px 2px 0px #fff, 3px 3px 0px #b57602;
  font-weight: 900;
}

.file-title {
  font-size: 1.15rem;
  color: #000;
  font-weight: 700;
  text-align: left;
}

.file-subtitle {
  display: block;
  font-size: 0.65rem;
  color: #333;
  font-family: 'Press Start 2P', monospace;
  margin-top: 6px;
  line-height: 1.4;
}

.slot-right {
  display: flex;
  align-items: center;
  gap: 6px;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.62rem;
  color: #222;
  font-weight: bold;
  white-space: nowrap;
}

/* =========================
   MODAL
========================= */
.modal-overlay {
  display: none;
  position: fixed;
  top: 0; left: 0; width: 100%; height: 100%;
  background: rgba(0, 0, 0, 0.6);
  z-index: 2000;
  justify-content: center;
  align-items: center;
  padding: 20px;
}

.modal-box {
  background: rgba(20, 20, 20, 0.92);
  border: 4px solid #f2a900;
  border-radius: 10px;
  padding: 22px 18px;
  max-width: 360px;
  width: 100%;
  text-align: center;
  box-shadow: 0 8px 20px rgba(0,0,0,0.8), inset 0 0 15px rgba(242, 169, 0, 0.3);
  animation: modalAparecer 0.25s ease-out;
}

@keyframes modalAparecer {
  0% { transform: scale(0.8); opacity: 0; }
  100% { transform: scale(1); opacity: 1; }
}

.modal-text {
  font-family: 'Press Start 2P', monospace;
  font-size: 0.72rem;
  color: #fff;
  line-height: 1.6;
  text-shadow: 2px 2px 0px #000;
  margin-bottom: 20px;
}

.modal-btn {
  background: #e52521;
  border: 3px solid #000;
  color: #fff;
  font-family: 'Press Start 2P', monospace;
  font-size: 0.65rem;
  padding: 10px 16px;
  border-radius: 6px;
  cursor: pointer;
  box-shadow: 0 4px 0px #9c1b19;
  transition: transform 0.1s ease;
}

.modal-btn:active {
  transform: translateY(2px);
  box-shadow: 0 2px 0px #9c1b19;
}

/* =========================
   BOTONES INFERIORES
========================= */
.buttons {
  margin-top: 25px;
  width: 100%;
  display: flex;
  flex-direction: column;
  gap: 20px;
  align-items: center;
}

.action-group {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 6px;
  animation: movimientoBotones 2.8s infinite ease-in-out alternate;
}

.action-group:nth-of-type(1) { animation-delay: 0.2s; }
.action-group:nth-of-type(2) { animation-delay: 0.7s; }
.action-group:nth-of-type(3) { animation-delay: 1.2s; }

@keyframes movimientoBotones {
  0% { transform: translateX(-8px); }
  100% { transform: translateX(8px); }
}

.icon-btn {
  display: block;
  width: 85px;
  height: 85px;
  background-image: url('caparazon.jpeg');
  background-size: cover;
  background-position: center;
  border: 4px solid #000;
  border-radius: 50%;
  box-shadow: 0 6px 0px #0b1d3a, 0 8px 14px rgba(0,0,0,0.6);
  cursor: pointer;
  position: relative;
  z-index: 50;
}
</style>
</head>

<body>
<div class="container">

       <i class="fa-solid fa-calendar-days"></i>

</body>
</html>
